# Publishes to npm by OIDC trusted publishing. Set up once on npmjs.com after the first manual publish, then no token is needed.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@latest
      - working-directory: packages/myclawn-mcp
        run: |
          npm ci
          npm test
          npm publish --access public --provenance
